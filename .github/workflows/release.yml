name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: sshex-linux-amd64
          - goarch: arm64
            asset: sshex-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify VERSION.txt matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(tr -d '[:space:]' < internal/assets/VERSION.txt)"
          if [ "$got" != "$want" ]; then
            echo "VERSION.txt ($got) does not match tag ($want)" >&2
            exit 1
          fi
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          make build
          mv dist/sshex "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum sshex-* > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sshex-*
            dist/checksums.txt
          generate_release_notes: true
